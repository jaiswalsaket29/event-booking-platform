spring:
  application:
    name: eventbooking
  datasource:
    url: jdbc:postgresql://localhost:5432/eventbooking
    username: eventbooking
    password: devpassword
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080