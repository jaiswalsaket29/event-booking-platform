spring:
  application:
    name: eventbooking
  datasource:
    url: jdbc:postgresql://localhost:5433/eventbooking
    username: eventbooking
    password: devpassword
  jpa:
    # No lazy loading outside service transactions: services return DTOs built inside the transaction.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # session creation inserts one session_seats row per hall seat
        jdbc:
          batch_size: 50
        order_inserts: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
app:
  jwt:
    refresh-token-expiry-days: 30
  auth:
    email-verification-token-ttl: 24h
    password-reset-token-ttl: 30m
  pricing:
    # Assigned seating: seat price = session basePrice x multiplier, frozen at session creation.
    seat-type-multipliers:
      REGULAR: 1.0
      PREMIUM: 1.5
      RECLINER: 2.0
  booking:
    # How long a PENDING booking holds its seats/capacity before they go back on sale.
    hold-ttl: ${BOOKING_HOLD_TTL:10m}
    max-tickets-per-booking: 10
    # Safety net: the sweeper expires PENDING bookings older than hold-ttl + sweep-grace
    # (covers expiry events missed while the app was down).
    sweep-grace: 30s
    sweeper:
      enabled: true
      interval: 60s
    configure-keyspace-notifications: true
  payments:
    max-attempts: 3
    currency: INR
    # HMAC-SHA256 key for POST /api/v1/payments/webhook. The default is for local dev only;
    # always set PAYMENT_WEBHOOK_SECRET in any shared environment.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret-change-me}
    simulated:
      # WEBHOOK: outcome arrives as a signed webhook (realistic). SYNC: charges finish immediately.
      mode: ${PAYMENT_SIMULATED_MODE:WEBHOOK}
      webhook-delay: 1500ms
  reporting:
    # Business time zone: dashboard "days" are calendar days here.
    zone: Asia/Kolkata
  seed:
    # Seed the demo catalog on startup when the database has no events (DemoDataSeeder).
    demo-data: ${SEED_DEMO_DATA:true}
  cors:
    # Comma-separated allowlist: frontend-user (5173) and frontend-admin (5174) in dev.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  frontend:
    # Base URL of the user-facing frontend; used to build links in emails.
    user-url: ${FRONTEND_USER_URL:http://localhost:5173}
server:
  port: 8080
---
# Optional Google OAuth2 login. Off by default so the app runs without Google credentials.
# Enable with SPRING_PROFILES_ACTIVE=google-oauth and set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
# Redirect URI to register with Google: {backend}/login/oauth2/code/google
spring:
  config:
    activate:
      on-profile: google-oauth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
