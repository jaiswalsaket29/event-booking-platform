spring:
  application:
    name: eventbooking
  datasource:
    url: jdbc:postgresql://localhost:5433/eventbooking
    username: eventbooking
    password: devpassword
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
server:
  port: 8080
