spring:
  application:
    name: eventbooking
  datasource:
    url: jdbc:postgresql://localhost:5433/eventbooking
    username: eventbooking
    password: devpassword
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # session creation inserts one session_seats row per hall seat
        jdbc:
          batch_size: 50
        order_inserts: true
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
app:
  jwt:
    refresh-token-expiry-days: 30
  auth:
    email-verification-token-ttl: 24h
    password-reset-token-ttl: 30m
  pricing:
    # Assigned seating: seat price = session basePrice x multiplier, frozen at session creation.
    seat-type-multipliers:
      REGULAR: 1.0
      PREMIUM: 1.5
      RECLINER: 2.0
  seed:
    # Seed the demo catalog on startup when the database has no events (DemoDataSeeder).
    demo-data: ${SEED_DEMO_DATA:true}
  cors:
    # Comma-separated allowlist: frontend-user (5173) and frontend-admin (5174) in dev.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  frontend:
    # Base URL of the user-facing frontend; used to build links in emails.
    user-url: ${FRONTEND_USER_URL:http://localhost:5173}
server:
  port: 8080
---
# Optional Google OAuth2 login. Off by default so the app runs without Google credentials.
# Enable with SPRING_PROFILES_ACTIVE=google-oauth and set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
# Redirect URI to register with Google: {backend}/login/oauth2/code/google
spring:
  config:
    activate:
      on-profile: google-oauth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
