spring:
  application:
    name: eventbooking
  datasource:
    url: jdbc:postgresql://localhost:5433/eventbooking
    username: eventbooking
    password: devpassword
  jpa:
    # No lazy loading outside service transactions: services return DTOs built inside the transaction.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # session creation inserts one session_seats row per hall seat
        jdbc:
          batch_size: 50
        order_inserts: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        max-page-size: 100
  # SMTP is off unless SPRING_MAIL_HOST is set (with SPRING_MAIL_PORT/USERNAME/PASSWORD); emails are then
  # really sent instead of logged. No empty default here: any value of spring.mail.host turns SMTP on.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
springdoc:
  # OpenAPI spec (/v3/api-docs) and Swagger UI (/swagger-ui.html), public. On by default for dev;
  # set API_DOCS_ENABLED=false in production.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha
  default-produces-media-type: application/json
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
app:
  jwt:
    refresh-token-expiry-days: 30
  auth:
    email-verification-token-ttl: 24h
    password-reset-token-ttl: 30m
  pricing:
    # Assigned seating: seat price = session basePrice x multiplier, frozen at session creation.
    seat-type-multipliers:
      REGULAR: 1.0
      PREMIUM: 1.5
      RECLINER: 2.0
  booking:
    # How long a PENDING booking holds its seats/capacity before they go back on sale.
    hold-ttl: ${BOOKING_HOLD_TTL:10m}
    max-tickets-per-booking: 10
    # Safety net: the sweeper expires PENDING bookings older than hold-ttl + sweep-grace
    # (covers expiry events missed while the app was down).
    sweep-grace: 30s
    # Don't end an expired hold while a payment opened within this window is still PENDING
    # (the sweeper retries). Prevents failing a booking the customer has just paid for.
    payment-grace: 2m
    sweeper:
      enabled: true
      interval: 60s
    configure-keyspace-notifications: true
  payments:
    max-attempts: 3
    currency: INR
    # HMAC-SHA256 key for POST /api/v1/payments/webhook. The default is for local dev only;
    # always set PAYMENT_WEBHOOK_SECRET in any shared environment.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-only-webhook-secret-change-me}
    simulated:
      # WEBHOOK: outcome arrives as a signed webhook (realistic). SYNC: charges finish immediately.
      mode: ${PAYMENT_SIMULATED_MODE:WEBHOOK}
      webhook-delay: 1500ms
  cache:
    # Public catalog cache (Redis). Listings carry no availability but go stale as sessions start, so
    # they live briefly; event detail (event, line-up, images; never sessions) is evicted on admin edits.
    event-list-ttl: 60s
    event-detail-ttl: 10m
  rate-limit:
    # Redis token buckets: capacity = burst, refilled continuously over refill-period.
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-per-ip: { capacity: 30, refill-period: 5m }
    login-per-email: { capacity: 10, refill-period: 15m }
    forgot-password-per-ip: { capacity: 10, refill-period: 15m }
    forgot-password-per-email: { capacity: 3, refill-period: 15m }
    booking-per-user: { capacity: 10, refill-period: 1m }
  storage:
    # Pre-signed direct uploads to Cloudflare R2. Leave the R2 values empty to turn uploads off;
    # admins then add images by URL.
    upload-url-ttl: 10m
    max-image-size: 5MB
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
  reporting:
    # Business time zone: dashboard "days" are calendar days here.
    zone: Asia/Kolkata
  seed:
    # Seed the demo catalog on startup when the database has no events (DemoDataSeeder).
    demo-data: ${SEED_DEMO_DATA:true}
  cors:
    # Comma-separated allowlist: frontend-user (5173) and frontend-admin (5174) in dev.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  mail:
    # Sender for SMTP email (must be a sender address your SMTP provider allows).
    from: ${MAIL_FROM:Event Booking <no-reply@eventbooking.dev>}
  frontend:
    # Base URL of the user-facing frontend; used to build links in emails.
    user-url: ${FRONTEND_USER_URL:http://localhost:5173}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        # Only health is exposed over HTTP; nothing else (env, beans, heapdump...) is reachable.
        include: health
  endpoint:
    health:
      # Public endpoint: status only, never component details.
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        # liveness = the JVM is fine (restart if not); readiness = can serve traffic (needs DB and Redis).
        # A database outage makes the instance unready, it doesn't get it restarted in a loop.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
---
# Optional Google OAuth2 login. Off by default so the app runs without Google credentials.
# Enable with SPRING_PROFILES_ACTIVE=google-oauth and set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET.
# Redirect URI to register with Google: {backend}/login/oauth2/code/google
spring:
  config:
    activate:
      on-profile: google-oauth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
