# Production profile: SPRING_PROFILES_ACTIVE=prod. Every secret and endpoint comes from the environment
# and the secrets have no defaults, so a missing one fails startup with "Could not resolve placeholder".
# ProductionReadinessCheck also refuses the published dev values (JWT/webhook secrets, admin password).
# Variables are listed in backend/.env.example and docs/deployment.md.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}${DB_URL_PARAMS:}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      # redis:// or rediss:// (TLS), with credentials if any; takes precedence over host/port.
      url: ${REDIS_URL}
server:
  port: ${PORT:8080}
  # Behind the platform's load balancer: Tomcat's RemoteIpValve takes the client IP and scheme from
  # X-Forwarded-For / X-Forwarded-Proto, but only when the request comes from an internal proxy address
  # (server.tomcat.remoteip.internal-proxies, private ranges by default). Rate limits rely on this.
  forward-headers-strategy: native
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
jwt:
  secret: ${JWT_SECRET}
app:
  admin:
    # Replaces the seeded admin's dev password at startup (required: startup fails while it's the dev one).
    password: ${ADMIN_PASSWORD}
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  booking:
    # Managed Redis usually forbids CONFIG SET; set notify-keyspace-events=Ex in the provider console
    # if possible. Without it, the sweeper still releases expired holds within a minute.
    configure-keyspace-notifications: ${REDIS_CONFIGURE_KEYSPACE_NOTIFICATIONS:false}
  seed:
    demo-data: ${SEED_DEMO_DATA:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  frontend:
    user-url: ${FRONTEND_USER_URL}
