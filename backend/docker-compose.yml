services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: eventbooking
      POSTGRES_USER: eventbooking
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    # Ex = publish key-expired events; booking holds are released when their TTL key expires.
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"

volumes:
  pgdata: