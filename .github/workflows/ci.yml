name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvnw verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the runner's Docker daemon (Postgres 16 + Redis 7).
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image (not pushed)
        run: docker build -t eventbooking-backend:ci backend

  frontends:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-user, frontend-admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      # The frontends haven't been scaffolded yet; these steps start running once package.json exists.
      - name: Skip (not scaffolded yet)
        if: hashFiles(format('{0}/package.json', matrix.app)) == ''
        working-directory: .
        run: echo "${{ matrix.app }} has no package.json yet; nothing to build."
      - uses: actions/setup-node@v7
        if: hashFiles(format('{0}/package.json', matrix.app)) != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        if: hashFiles(format('{0}/package.json', matrix.app)) != ''
        run: npm ci
      - name: Lint
        if: hashFiles(format('{0}/package.json', matrix.app)) != ''
        run: npm run lint
      - name: Build
        if: hashFiles(format('{0}/package.json', matrix.app)) != ''
        run: npm run build
